name: voice-integrity-online
services:
  nginx:
    image: nginx:1.28-alpine
    network_mode: host
    restart: unless-stopped
    read_only: true
    entrypoint: [nginx]
    command: [-g, "daemon off;", -c, /etc/nginx/voice-integrity/nginx.conf]
    volumes:
      - ./runtime/nginx:/etc/nginx/voice-integrity:ro
      - ./runtime/tls:/etc/voice-integrity/tls:ro
      - ./runtime/acme:/var/www/acme:ro
      - ./static:/srv/www:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  coturn:
    image: coturn/coturn:4.18.0-r0-alpine
    network_mode: host
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    command: [-c, /etc/coturn/turnserver.conf]
    volumes:
      - ./runtime/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./runtime/tls:/etc/voice-integrity/tls:ro
    tmpfs:
      - /tmp
      - /var/lib/coturn:uid=65534,gid=65534,mode=0700
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  certbot:
    image: certbot/certbot:v5.0.0
    profiles: [maintenance]
    volumes:
      - ./runtime/letsencrypt:/etc/letsencrypt
      - ./runtime/acme:/var/www/acme
    tmpfs:
      - /var/lib/letsencrypt
      - /var/log/letsencrypt
