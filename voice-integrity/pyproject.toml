[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vif"
version = "0.1.0"
description = "Voice Integrity Verification Framework - backend"
requires-python = ">=3.11"  # webrtc.py relies on asyncio timeouts being TimeoutError

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: str+Enum is deliberate - the enums already serialise as plain strings
#        through pydantic and JSON, so StrEnum would change nothing but churn.
# B027:  BaseVAD.reset is an optional hook, not a required override.
ignore = ["E501", "UP042", "B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
